---
name: PR Conventional Commit Validation
run-name: "PR Conventional Commit Validation"

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions: {}

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1  # v1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","style"]'
          add_label: 'false'
